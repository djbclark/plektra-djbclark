name: Android CI (forgejo.mit.edu)

on:
  pull_request:
  push:
    branches: ['bench/**']

jobs:
  gradle-checks:
    runs-on: ubuntu

    steps:
      - name: Checkout
        uses: https://github.com/actions/checkout@v4

      - name: Install JDK 17 and Android SDK (timed separately from Gradle)
        run: |
          trap 'echo "BENCHSTEP end Install JDK 17 and Android SDK (timed separately from Gradle) $(date +%s.%N) rc=$?"' EXIT
          echo "BENCHSTEP start Install JDK 17 and Android SDK (timed separately from Gradle) $(date +%s.%N)"
          set -euo pipefail
          nproc; free -g | head -2
          apt-get update -qq
          apt-get install -y -qq openjdk-17-jdk-headless unzip gcc libc6-dev
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          java -version
          export ANDROID_HOME="$HOME/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Build loopback port-0 shim (libkrun#818 workaround)
        run: |
          trap 'echo "BENCHSTEP end Build loopback port-0 shim (libkrun#818 workaround) $(date +%s.%N) rc=$?"' EXIT
          echo "BENCHSTEP start Build loopback port-0 shim (libkrun#818 workaround) $(date +%s.%N)"
          cat > /tmp/portshim.c <<'SHIM_C'
          /* LD_PRELOAD shim: rewrite bind(port 0) to a concrete random port.
           *
           * Works around libkrun TSI bug libkrun#818: a listener bound to port 0 lands on
           * a different port in the VMM's netns and is unreachable; fixed-port binds work.
           * Inherited by every child JVM through the environment.
           *
           *   gcc -shared -fPIC -O2 -o /tmp/portshim.so loopback-port-shim.c -ldl
           *   LD_PRELOAD=/tmp/portshim.so ./gradlew ...
           */
          #define _GNU_SOURCE
          #include <dlfcn.h>
          #include <errno.h>
          #include <netinet/in.h>
          #include <stdlib.h>
          #include <sys/socket.h>
          #include <time.h>
          #include <unistd.h>

          typedef int (*bind_fn)(int, const struct sockaddr *, socklen_t);

          int bind(int fd, const struct sockaddr *addr, socklen_t len) {
              static bind_fn real;
              if (!real) real = (bind_fn)dlsym(RTLD_NEXT, "bind");
              if (!addr) return real(fd, addr, len);

              int zero = 0;
              if (addr->sa_family == AF_INET && len >= sizeof(struct sockaddr_in))
                  zero = ((const struct sockaddr_in *)addr)->sin_port == 0;
              else if (addr->sa_family == AF_INET6 && len >= sizeof(struct sockaddr_in6))
                  zero = ((const struct sockaddr_in6 *)addr)->sin6_port == 0;
              if (!zero) return real(fd, addr, len);

              union { struct sockaddr_storage ss; struct sockaddr_in a4; struct sockaddr_in6 a6; } copy;
              if (len > sizeof copy) return real(fd, addr, len);
              __builtin_memcpy(&copy, addr, len);
              unsigned seed = (unsigned)getpid() * 2654435761u ^ (unsigned)time(NULL) ^ (unsigned)fd;
              /* 20000-32000: below the kernel ephemeral range, so no clash with auto-assigned ports */
              for (int i = 0; i < 200; i++) {
                  unsigned short port = (unsigned short)(20000 + rand_r(&seed) % 12000);
                  if (copy.ss.ss_family == AF_INET) copy.a4.sin_port = htons(port);
                  else copy.a6.sin6_port = htons(port);
                  int rc = real(fd, (struct sockaddr *)&copy, len);
                  if (rc == 0 || errno != EADDRINUSE) return rc;
              }
              return real(fd, addr, len);
          }
          SHIM_C
          gcc -shared -fPIC -O2 -o /usr/local/lib/portshim.so /tmp/portshim.c -ldl
          echo /usr/local/lib/portshim.so >> /etc/ld.so.preload
          true && python3 -c 'print("preload ok")'

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Compile stable debug (compile time only)
        run: |
          trap 'echo "BENCHSTEP end Compile stable debug (compile time only) $(date +%s.%N) rc=$?"' EXIT
          echo "BENCHSTEP start Compile stable debug (compile time only) $(date +%s.%N)"
          ./gradlew :app:compileStableDebugKotlin :app:compileStableDebugJavaWithJavac

      - name: Run core modifier regression tests
        run: |
          trap 'echo "BENCHSTEP end Run core modifier regression tests $(date +%s.%N) rc=$?"' EXIT
          echo "BENCHSTEP start Run core modifier regression tests $(date +%s.%N)"
          ./gradlew :app:testStableDebugUnitTest --tests rocks.pkb.plektra.core.ModifierStateControllerTest

      - name: Run input router modifier E2E tests
        run: |
          trap 'echo "BENCHSTEP end Run input router modifier E2E tests $(date +%s.%N) rc=$?"' EXIT
          echo "BENCHSTEP start Run input router modifier E2E tests $(date +%s.%N)"
          ./gradlew :app:testStableDebugUnitTest --tests rocks.pkb.plektra.inputmethod.InputEventRouterModifierE2ETest

      - name: Run input router forward-delete tests
        run: |
          trap 'echo "BENCHSTEP end Run input router forward-delete tests $(date +%s.%N) rc=$?"' EXIT
          echo "BENCHSTEP start Run input router forward-delete tests $(date +%s.%N)"
          ./gradlew :app:testStableDebugUnitTest --tests rocks.pkb.plektra.inputmethod.InputEventRouterForwardDeleteAlternativesTest

      - name: Run IME device behaviour tests
        run: |
          trap 'echo "BENCHSTEP end Run IME device behaviour tests $(date +%s.%N) rc=$?"' EXIT
          echo "BENCHSTEP start Run IME device behaviour tests $(date +%s.%N)"
          ./gradlew :app:testStableDebugUnitTest --tests rocks.pkb.plektra.inputmethod.PhysicalKeyboardInputMethodServiceDeviceBehaviorTest

      - name: Run stable debug unit tests
        run: |
          trap 'echo "BENCHSTEP end Run stable debug unit tests $(date +%s.%N) rc=$?"' EXIT
          echo "BENCHSTEP start Run stable debug unit tests $(date +%s.%N)"
          ./gradlew :app:testStableDebugUnitTest

      - name: Run stable release unit tests (F-Droid path)
        run: |
          trap 'echo "BENCHSTEP end Run stable release unit tests (F-Droid path) $(date +%s.%N) rc=$?"' EXIT
          echo "BENCHSTEP start Run stable release unit tests (F-Droid path) $(date +%s.%N)"
          ./gradlew :app:testStableReleaseUnitTest -PPLEKTRA_FDROID_BUILD=true

      - name: Run nightly debug unit tests
        run: |
          trap 'echo "BENCHSTEP end Run nightly debug unit tests $(date +%s.%N) rc=$?"' EXIT
          echo "BENCHSTEP start Run nightly debug unit tests $(date +%s.%N)"
          ./gradlew :app:testNightlyDebugUnitTest

      - name: Compile and test Google Play variants
        run: |
          trap 'echo "BENCHSTEP end Compile and test Google Play variants $(date +%s.%N) rc=$?"' EXIT
          echo "BENCHSTEP start Compile and test Google Play variants $(date +%s.%N)"
          ./gradlew :app:testPlayStableDebugUnitTest :app:testPlayNightlyDebugUnitTest

      - name: Run nightly release unit tests
        run: |
          trap 'echo "BENCHSTEP end Run nightly release unit tests $(date +%s.%N) rc=$?"' EXIT
          echo "BENCHSTEP start Run nightly release unit tests $(date +%s.%N)"
          ./gradlew :app:testNightlyReleaseUnitTest

      - name: Run stable debug lint
        run: |
          trap 'echo "BENCHSTEP end Run stable debug lint $(date +%s.%N) rc=$?"' EXIT
          echo "BENCHSTEP start Run stable debug lint $(date +%s.%N)"
          ./gradlew :app:lintStableDebug

      - name: Run stable release lint
        run: |
          trap 'echo "BENCHSTEP end Run stable release lint $(date +%s.%N) rc=$?"' EXIT
          echo "BENCHSTEP start Run stable release lint $(date +%s.%N)"
          ./gradlew :app:lintStableRelease

      - name: Run nightly debug lint
        run: |
          trap 'echo "BENCHSTEP end Run nightly debug lint $(date +%s.%N) rc=$?"' EXIT
          echo "BENCHSTEP start Run nightly debug lint $(date +%s.%N)"
          ./gradlew :app:lintNightlyDebug

      - name: Run nightly release lint
        run: |
          trap 'echo "BENCHSTEP end Run nightly release lint $(date +%s.%N) rc=$?"' EXIT
          echo "BENCHSTEP start Run nightly release lint $(date +%s.%N)"
          ./gradlew :app:lintNightlyRelease
