name: Plektra djb build and release (ci/run)

# Fork-only (ci/base overlay): scripts/github-test-ref --release REF pushes an overlay
# commit whose message contains [djb-release]. Publishes a GitHub release with the same
# tag/asset naming as the Forgejo job.

on:
  push:
    branches: ['ci/run/**']

permissions:
  contents: write

jobs:
  build-release:
    if: ${{ contains(github.event.head_commit.message, '[djb-release]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DJB_SIGNER_SHA256: 5ca8d5fcce4bad08206eb7e112b5c9d63b35b0a8874e3d25af48e8e332a9596a
      APK: app/build/outputs/apk/stable/debug/app-stable-debug.apk
    steps:
      - name: Checkout overlay commit
        uses: actions/checkout@v4

      - name: Read run metadata
        id: meta
        run: |
          set -euo pipefail
          . .github/ci/run-meta.env
          echo "target_ref=$TARGET_REF" >> "$GITHUB_OUTPUT"
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "target $TARGET_REF @ $TARGET_SHA"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'tools platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install debug signing key
        env:
          DJB_DEBUG_KEYSTORE_B64: ${{ secrets.DJB_DEBUG_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          keydir="${ANDROID_USER_HOME:-$HOME/.android}"
          mkdir -p "$keydir"
          printf '%s' "$DJB_DEBUG_KEYSTORE_B64" | base64 -d > "$keydir/debug.keystore"
          test -s "$keydir/debug.keystore"
          chmod +x ./gradlew

      - name: Test and assemble stable debug
        run: |
          set -euo pipefail
          ./gradlew --no-daemon \
            --init-script .github/ci/known-failures.gradle \
            --init-script .github/ci/central-mirror.gradle \
            :app:testStableDebugUnitTest :app:assembleStableDebug

      - name: Check the APK signer
        run: |
          set -euo pipefail
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$build_tools/apksigner" verify --print-certs "$APK" > /tmp/signer.txt
          cat /tmp/signer.txt
          grep -q "certificate SHA-256 digest: $DJB_SIGNER_SHA256" /tmp/signer.txt

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_SHA: ${{ steps.meta.outputs.target_sha }}
          TARGET_REF: ${{ steps.meta.outputs.target_ref }}
        run: |
          set -euo pipefail
          export COMMIT_SUBJECT="$(git log -1 --format=%s -- "$TARGET_SHA" 2>/dev/null || true)"
          # Prefer subject of the real target commit if present in this repo.
          if git cat-file -e "${TARGET_SHA}^{commit}" 2>/dev/null; then
            COMMIT_SUBJECT=$(git log -1 --format=%s "$TARGET_SHA")
          fi
          export COMMIT_SUBJECT SIGNER_SHA256="$DJB_SIGNER_SHA256"
          python3 .github/ci/djb_release.py "$APK"
