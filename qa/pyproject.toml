[project]
name = "plektra-qa"
version = "0.1.0"
description = "FIRERPA hardware-in-the-loop QA harness for Plektra"
requires-python = ">=3.12,<3.15"
dependencies = [
    "lamda==10.12",
    "mcp[cli]>=1.9",
    "pydantic>=2",
    "pyyaml>=6",
    "rich>=13",
    "typer>=0.12",
]

[project.scripts]
plektra-qa = "plektra_qa.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plektra_qa"]
