name: tab_first_letter
# Does the first letter typed after Tab moves the cursor arrive? Seen once (2026-11-25), in Pinnote
# only: the title read "Eta" after "beta". This repeats the step on the test bench of the button bar
# app (qa/overlay-app, version 0.3.0 or newer), a second app that also records what happened: every
# try reports the keys pressed, and for a failed one whether the person typed something else, and how
# far a missing letter got (qa/README.md section 12). The bench handles keyboard configuration changes
# itself, so a loss there cannot come from the app restarting (titan2-elite-facts.md, sections 7 and 10).
#
# Each try starts with all boxes empty and the cursor in box 1 (Body). Tab moves it to box 2 (Title).
# A try reads the box that has the focus, so also watch that Tab moved the cursor there. Leave about
# two seconds between tries. A passed try is remembered for this keyboard build: --redo runs all three
# again. Three tries is the limit for one action (qa/README.md section 6). A failure that also happens
# in a real second app is the keyboard's; the bench alone does not prove it (qa/README.md section 8).
start_wait_s: 10
sentinel: "\n"
phases:
  - name: tab_first_letter_bench
    package: dev.hitlbar.overlay
    activity: dev.hitlbar.overlay.BenchActivity
    start_resource_id: dev.hitlbar.overlay:id/probe_body
    probe_field: title
    trials:
      - prompt: "try 1 of 3: <Tab>, then type beta"
        shade: "Try 1 of 3: <Tab>, then type beta"
        speak: "Try 1. <Tab>, then type beta."
        expect: "beta"
        expect_ci_first: true
      - prompt: "try 2 of 3: <Tab>, then type beta"
        shade: "Try 2 of 3: <Tab>, then type beta"
        speak: "Try 2. <Tab>, then type beta."
        expect: "beta"
        expect_ci_first: true
      - prompt: "try 3 of 3: <Tab>, then type beta"
        shade: "Try 3 of 3: <Tab>, then type beta"
        speak: "Try 3. <Tab>, then type beta."
        expect: "beta"
        expect_ci_first: true
